<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Insurance Prediction</title>

  <!-- Bootstrap فقط -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body{
      min-height: 100vh;
      background:
        radial-gradient(900px 450px at 10% 15%, rgba(102,126,234,.55), transparent 60%),
        radial-gradient(900px 450px at 90% 10%, rgba(0,212,255,.35), transparent 55%),
        linear-gradient(180deg, #0b1020 0%, #111a3a 100%);
      color: #e9eefc;
    }
    .app-shell{ max-width: 980px; }
    .glass-card{
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 18px;
      backdrop-filter: blur(12px);
      box-shadow: 0 18px 50px rgba(0,0,0,.35);
    }
    .brand-badge{
      width: 44px; height: 44px; border-radius: 14px;
      background: linear-gradient(135deg, #6ea8fe 0%, #7c4dff 100%);
      display:flex; align-items:center; justify-content:center;
      box-shadow: 0 12px 30px rgba(124,77,255,.35);
      font-weight: 800;
    }
    .subtle{ color: rgba(233,238,252,.78); }
    .form-label{ color: rgba(233,238,252,.85); font-weight: 600; }
    .form-control, .form-select{
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.16);
      color: #e9eefc;
      border-radius: 12px;
      padding: .75rem .9rem;
    }
    .form-control:focus, .form-select:focus{
      border-color: rgba(110,168,254,.8);
      box-shadow: 0 0 0 .25rem rgba(110,168,254,.15);
      background: rgba(255,255,255,.08);
      color: #e9eefc;
    }
    .form-select option{ color: #111; }
    .btn-gradient{
      border: 0;
      background: linear-gradient(135deg, #6ea8fe 0%, #7c4dff 100%);
      border-radius: 12px;
      padding: .85rem 1rem;
      font-weight: 700;
      box-shadow: 0 14px 35px rgba(124,77,255,.28);
    }
    .btn-gradient:hover{ filter: brightness(1.06); }
    .footer-note{ color: rgba(233,238,252,.65); }
    .chip{
      display:inline-flex; align-items:center; gap:.4rem;
      padding:.35rem .6rem; border-radius: 999px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.14);
      color: rgba(233,238,252,.8);
      font-size: .9rem;
    }
  </style>
</head>

<body>
  <div class="container app-shell py-4 py-md-5">
    <!-- Header -->
    <div class="d-flex align-items-center justify-content-between mb-4">
      <div class="d-flex align-items-center gap-3">
        <div class="brand-badge">IP</div>
        <div>
          <h1 class="h3 mb-1">Insurance Prediction</h1>
          <div class="subtle">Enter customer data to predict cross-sell probability.</div>
        </div>
      </div>
      <span class="chip">MLOps Demo</span>
    </div>

    <!-- Error -->
    {% if error %}
    <div class="alert alert-danger glass-card mb-4" role="alert">
      <strong>Error:</strong> {{ error }}
    </div>
    {% endif %}

    <!-- Card -->
    <div class="glass-card p-4 p-md-5">
      <h2 class="h5 mb-3">Customer Information</h2>
      <p class="subtle mb-4">Fill all fields then click Predict.</p>

      <form method="POST" action="/predict">
        <div class="row g-3">
          <div class="col-md-6">
            <label for="Gender" class="form-label">Gender</label>
            <select id="Gender" name="Gender" class="form-select" required>
              <option value="Male" selected>Male</option>
              <option value="Female">Female</option>
            </select>
          </div>

          <div class="col-md-6">
            <label for="Age" class="form-label">Age</label>
            <input type="number" id="Age" name="Age" class="form-control" min="0" required placeholder="e.g., 35">
          </div>

          <div class="col-md-6">
            <label for="HasDrivingLicense" class="form-label">Has Driving License</label>
            <input type="number" id="HasDrivingLicense" name="HasDrivingLicense" class="form-control" required placeholder="1 = Yes, 0 = No">
          </div>

          <div class="col-md-6">
            <label for="RegionID" class="form-label">Region ID</label>
            <input type="number" id="RegionID" name="RegionID" class="form-control" step="any" required placeholder="e.g., 21">
          </div>

          <div class="col-md-6">
            <label for="Switch" class="form-label">Switch</label>
            <input type="number" id="Switch" name="Switch" class="form-control" required placeholder="e.g., 0 or -1">
          </div>

          <div class="col-md-6">
            <label for="PastAccident" class="form-label">Past Accident</label>
            <select id="PastAccident" name="PastAccident" class="form-select" required>
              <option value="Yes" selected>Yes</option>
              <option value="No">No</option>
              <option value="Unknown">Unknown</option>
            </select>
          </div>

          <div class="col-12">
            <label for="AnnualPremium" class="form-label">Annual Premium</label>
            <input type="number" id="AnnualPremium" name="AnnualPremium" class="form-control" step="any" required placeholder="e.g., 2305.40">
          </div>

          <div class="col-12 d-grid mt-3">
            <button type="submit" class="btn btn-gradient btn-lg">Predict</button>
          </div>
        </div>
      </form>
    </div>

    <div class="text-center mt-4 footer-note">
      &copy; 2026 Insurance Prediction • UI updated
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
